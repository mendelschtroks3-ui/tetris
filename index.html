<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tetris</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="layout">
      <section class="game-panel">
        <h1>Tetris</h1>
        <canvas id="board" width="300" height="600" aria-label="Tetris game board"></canvas>
        <div class="controls">
          <button id="startButton">Start / Restart</button>
          <p class="hint">Controls: ← → move, ↑ rotate, ↓ soft drop, Space hard drop, P pause</p>
        </div>
      </section>

      <aside class="stats-panel">
        <h2>Stats</h2>
        <dl>
          <div><dt>Score</dt><dd id="score">0</dd></div>
          <div><dt>Lines</dt><dd id="lines">0</dd></div>
          <div><dt>Level</dt><dd id="level">1</dd></div>
        </dl>
        <div class="next-piece">
          <h3>Next</h3>
          <canvas id="next" width="120" height="120" aria-label="Next piece preview"></canvas>
        </div>
        <p id="status" class="status">Press start to play.</p>
      </aside>
    </main>

    <script src="script.js"></script>
  </body>
</html>
